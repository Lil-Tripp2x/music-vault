<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Vault</title>
    <style>
        body { background-color: #121212; color: #e4e4e7; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .app-container { display: flex; height: calc(100vh - 90px); overflow: hidden; }
        aside { width: 240px; background-color: #000; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
        .logo { color: #a855f7; font-weight: 900; font-size: 20px; letter-spacing: 1px; text-transform: uppercase; }
        nav { display: flex; flex-direction: column; gap: 16px; }
        nav a { color: #a1a1aa; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; items: center; gap: 12px; transition: color 0.2s; }
        nav a:hover { color: #fff; }
        main { flex: 1; background-color: #121212; overflow-y: auto; padding: 32px; box-sizing: border-box; }
        .search-container { max-width: 800px; margin-bottom: 32px; }
        #search-bar { width: 100%; background-color: #242424; color: #fff; border: none; border-radius: 9999px; padding: 12px 20px; box-sizing: border-box; font-size: 14px; outline: none; }
        h2 { font-size: 20px; color: #fff; margin-bottom: 16px; font-weight: 700; }
        .track-list { display: flex; flex-direction: column; gap: 8px; max-width: 800px; margin-bottom: 40px; }
        .track-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background-color: #181818; border-radius: 4px; cursor: pointer; transition: background-color 0.2s; }
        .track-row:hover { background-color: #282828; }
        .track-info { display: flex; align-items: center; gap: 12px; }
        .track-art { width: 40px; height: 40px; background-color: #282828; border-radius: 4px; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .track-meta { overflow: hidden; }
        .track-meta .title { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-meta .era { font-size: 12px; color: #a1a1aa; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-time { font-size: 12px; color: #71717a; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 40px; }
        .card { background-color: #181818; padding: 16px; border-radius: 6px; cursor: pointer; transition: background-color 0.2s; box-sizing: border-box; }
        .card:hover { background-color: #282828; }
        .card-art { aspect-ratio: 1/1; background-color: #282828; border-radius: 4px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; overflow: hidden; }
        .card-art img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-size: 14px; font-weight: 700; color: #fff; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-era { font-size: 12px; color: #a1a1aa; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        footer { height: 90px; background-color: #181818; border-top: 1px solid #27272a; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; box-sizing: border-box; }
        .footer-left { display: flex; align-items: center; gap: 16px; width: 33%; min-width: 200px; }
        #player-art { width: 56px; height: 56px; background-color: #282828; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; }
        #player-art img { width: 100%; height: 100%; object-fit: cover; }
        .player-meta { overflow: hidden; }
        #player-title { font-size: 14px; font-weight: 600; color: #fff; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #player-era { font-size: 12px; color: #a1a1aa; margin: 2px 0 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .footer-center { width: 33%; max-width: 600px; display: flex; flex-direction: column; align-items: center; }
        audio { width: 100%; height: 32px; }
        .footer-right { width: 33%; }
        @media (max-width: 768px) { aside { display: none; } }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside>
            <div class="logo">MY MUSIC VAULT</div>
            <nav style="display: flex; flex-direction: column; gap: 16px;">
                <a href="#" onclick="renderInterface(vaultDatabase); return false;" style="color: #a1a1aa; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 12px; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#a1a1aa'">🏠 All Songs</a>
                <a href="#" onclick="renderInterface(vaultDatabase.filter(s => s.era.toUpperCase().includes('TRIPP'))); return false;" style="color: #a1a1aa; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 12px; transition: color 0.2s; cursor: pointer;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#a1a1aa'">📀 Album</a>
                <a href="https://www.instagram.com/real_lil_supreme/" target="_blank" rel="noopener noreferrer" style="color: #a1a1aa; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 12px; transition: color 0.2s; cursor: pointer;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#a1a1aa'">👤 Contact</a>
            </nav>
        </aside>

        <!-- Main Dashboard Window Container -->
        <main>
            <!-- Top Search Utility Bar -->
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search songs, eras...">
            </div>

            <!-- Horizontal Tracks Row Layout List -->
            <section>
                <h2>Recently Uploaded</h2>
                <div id="recent-list" class="track-list">
                    <!-- Dynamic entries -->
                </div>
            </section>

            <!-- Square Visual Image Cards Grid -->
            <section>
                <h2>Unreleased Tracks</h2>
                <div id="unreleased-grid" class="grid-container">
                    <!-- Dynamic entries -->
                </div>
            </section>
        </main>
    </div>

    <!-- Persistent Global Fixed Media Player -->
    <footer>
        <div class="footer-left">
            <div id="player-art">🎵</div>
            <div class="player-meta">
                <h4 id="player-title">No Track Playing</h4>
                <p id="player-era">Select music to start streaming</p>
            </div>
        </div>

        <div class="footer-center">
            <audio id="global-audio-engine" controls></audio>
        </div>
        
        <div class="footer-right"></div>
    </footer>

    <script>
        // EDIT THIS DATABASE TO ADD YOUR SONGS AND CLOUDINARY LINKS
        const vaultDatabase = [
            {
                id: "track_1",
                title: "U dont know",
                era: "TRIPP SEASON",
                length: "2:01",
                sourceUrl: "https://res.cloudinary.com/lwtbjjxz/video/upload/v1785127402/U_dont_know_1_-_AudioTrimmer.com_kiywkz.wav",
                coverArtUrl: "https://res.cloudinary.com/lwtbjjxz/image/upload/v1785128753/ChatGPT_Image_Jul_27_2026_01_02_53_AM_pvjpj4.png"
            },
            {
                id: "track_2",
                title: "Gone 4 U",
                era: "TRIPP SEASON",
                length: "2:17",
                sourceUrl: "https://res.cloudinary.com/lwtbjjxz/video/upload/v1785126438/Gone_4_u_Official_Audio_2_qkttkt.wav",
                coverArtUrl: "https://res.cloudinary.com/lwtbjjxz/image/upload/v1785126446/ChatGPT_Image_Jul_27_2026_12_25_10_AM_mpzokg.png"
            },
            {
                id: "track_3",
                title: "Wreckage on Route 9",
                era: "TRIPP SEASON",
                length: "2:43",
                sourceUrl: "https://res.cloudinary.com/lwtbjjxz/video/upload/v1785130140/Official_Audio-_AudioTrimmer.com_fdljua.wav",
                coverArtUrl: "https://res.cloudinary.com/lwtbjjxz/image/upload/v1785131879/1169cd69-f78c-4651-acb6-b82a358a4f27_aymepv.png"
            },
            {
                id: "track_4",
                title: "Rockstar v2",
                era: "SINGLE",
                length: "3:00",
                sourceUrl: "https://res.cloudinary.com/lwtbjjxz/video/upload/v1785134808/DOOM_CHXLD__Rockstar_Official_Audio_2_pfnpy9.wav",
                coverArtUrl: "https://res.cloudinary.com/lwtbjjxz/image/upload/v1785134814/200x200_hfmchq.jpg"
            },
            {
                id: "track_5",
                title: "Love & Drugs",
                era: "TRIPP SEASON",
                length: "2:53",
                sourceUrl: "https://res.cloudinary.com/lwtbjjxz/video/upload/v1785171586/Love__Drugs_1_mj8dnn.wav",
                coverArtUrl: "https://res.cloudinary.com/lwtbjjxz/image/upload/v1785171577/ChatGPT_Image_Jul_27_2026_12_59_27_PM_qcmn4c.png"
            },
            {
                id: "track_6",
                title: "Broke Bones (Freestyle)",
                era: "SINGLE",
                length: "2:30",
                sourceUrl: "https://res.cloudinary.com/lwtbjjxz/video/upload/v1785183174/Broke_not_releasing-_AudioTrimmer.com_zf6ry0.wav",
                coverArtUrl: "https://res.cloudinary.com/lwtbjjxz/image/upload/v1785183770/2f18d838-b215-40ee-a988-f22879f9b370_wyztni.png"
            },
            {
                id: "track_6",
                title: "2 Twin Glocks",
                era: "SINGLE",
                length: "2:30",
                sourceUrl: "https://res.cloudinary.com/lwtbjjxz/video/upload/v1785172450/Later_u_know_ufqnq2.wav",
                coverArtUrl: "PASTE_YOUR_NEW_CLOUDINARY_IMAGE_LINK_HERE"
            }
        ];

        const recentListContainer = document.getElementById('recent-list');
        const unreleasedGridContainer = document.getElementById('unreleased-grid');
        const searchBar = document.getElementById('search-bar');
        
        const audioNode = document.getElementById('global-audio-engine');
        const artNode = document.getElementById('player-art');
        const titleNode = document.getElementById('player-title');
        const eraNode = document.getElementById('player-era');

        function renderInterface(songs) {
            recentListContainer.innerHTML = '';
            unreleasedGridContainer.innerHTML = '';

            songs.forEach(song => {
                // Build List Row
                const row = document.createElement('div');
                row.className = "track-row";
                row.onclick = () => initPlayback(song);
                row.innerHTML = `
                    <div class="track-info">
                        <img src="${song.coverArtUrl}" class="track-art">
                        <div class="track-meta">
                            <div class="title">${song.title}</div>
                            <div class="era">${song.era}</div>
                        </div>
                    </div>
                    <div class="track-time">${song.length}</div>
                `;
                recentListContainer.appendChild(row);

                // Build Square Card
                const card = document.createElement('div');
                card.className = "card";
                card.onclick = () => initPlayback(song);
                card.innerHTML = `
                    <div class="card-art">
                        <img src="${song.coverArtUrl}">
                    </div>
                    <h3 class="card-title">${song.title}</h3>
                    <p class="card-era">${song.era}</p>
                `;
                unreleasedGridContainer.appendChild(card);
            });
        }

        function initPlayback(song) {
            audioNode.src = song.sourceUrl;
            titleNode.textContent = song.title;
            eraNode.textContent = song.era;
            artNode.innerHTML = `<img src="${song.coverArtUrl}">`;
            audioNode.play();
        }

        searchBar.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const matching = vaultDatabase.filter(s => s.title.toLowerCase().includes(query) || s.era.toLowerCase().includes(query));
            renderInterface(matching);
        });

        renderInterface(vaultDatabase);
    </script>
</body>
</html>
