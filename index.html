<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice WRLD Vault Clone</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-zinc-200 font-sans min-h-screen flex flex-col selection:bg-purple-500/30 selection:text-purple-200">

    <div class="flex flex-1 overflow-hidden h-[calc(100vh-90px)]">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-black p-6 flex flex-col justify-between hidden md:flex">
            <div class="space-y-6">
                <div class="text-purple-500 font-black text-xl tracking-wider uppercase">JUICE WRLD VAULT</div>
                <nav class="space-y-4 text-sm font-semibold text-zinc-400">
                    <a href="#" class="flex items-center gap-3 text-white"><span class="text-lg">🏠</span> Home</a>
                    <a href="#" class="flex items-center gap-3 hover:text-white transition"><span class="text-lg">📊</span> Charts</a>
                    <a href="#" class="flex items-center gap-3 hover:text-white transition"><span class="text-lg">💨</span> Reminds</a>
                </nav>
                <div class="pt-4 border-t border-zinc-900">
                    <div class="text-xs uppercase font-bold text-zinc-500 tracking-wider mb-3">Playlists</div>
                    <a href="#" class="flex items-center gap-3 text-sm font-semibold text-zinc-400 hover:text-white transition"><span class="text-lg">❤️</span> Liked Songs</a>
                </div>
            </div>
        </aside>

        <!-- Main Dashboard Window Container -->
        <main class="flex-1 bg-[#121212] overflow-y-auto p-6 md:p-8">
            <!-- Top Search Utility Bar -->
            <div class="max-w-4xl mb-8">
                <input type="text" id="search-bar" placeholder="Search songs, artists..." 
                       class="w-full bg-[#242424] text-sm text-zinc-200 placeholder-zinc-500 rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 transition">
            </div>

            <!-- Horizontal Tracks Row Layout List -->
            <section class="mb-10">
                <h2 class="text-xl font-bold text-white mb-4">Recently Uploaded</h2>
                <div id="recent-list" class="space-y-2 max-w-4xl">
                    <!-- Loaded dynamically via javascript engine arrays -->
                </div>
            </section>

            <!-- Square Visual Image Display Component Cards Grid Container Grid Section -->
            <section class="mb-10">
                <h2 class="text-xl font-bold text-white mb-4">Unreleased Vault Tracks</h2>
                <div id="unreleased-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    <!-- Dynamic grid elements injected dynamically here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Persistent Global Fixed Media Streaming Sticky Control Strip Footer Strip -->
    <footer class="h-[90px] bg-[#181818] border-t border-zinc-900 px-6 flex items-center justify-between fixed bottom-0 left-0 right-0 z-50">
        <div class="flex items-center gap-4 w-1/3">
            <div id="player-art" class="w-14 h-14 bg-zinc-800 rounded shadow flex items-center justify-center text-xl overflow-hidden font-bold text-zinc-600">🧃</div>
            <div class="truncate">
                <h4 id="player-title" class="text-sm font-medium text-white truncate">No Track Playing</h4>
                <p id="player-era" class="text-xs text-zinc-400 truncate">Select music to start streaming</p>
            </div>
        </div>

        <div class="w-1/3 max-w-xl flex flex-col items-center gap-2">
            <audio id="global-audio-engine" class="w-full h-8 accent-purple-500" controls></audio>
        </div>
        
        <div class="w-1/3 flex justify-end"></div>
    </footer>

    <script>
        // PASTE YOUR CLOUDINARY MP3 LINKS DIRECTLY INSIDE THESE TRACK BLOCKS
        const vaultDatabase = [
            {
                id: "track_1",
                title: "Compromised (v2) [Master & Edit]",
                era: "Juice WRLD • Jul 25, 2026",
                length: "3:52",
                sourceUrl: "https://soundhelix.com",
                coverArtUrl: "https://unsplash.com"
            },
            {
                id: "track_2",
                title: "Put Me Down",
                era: "By Juice WRLD",
                length: "2:25",
                sourceUrl: "https://soundhelix.com",
                coverArtUrl: "https://unsplash.com"
            },
            {
                id: "track_3",
                title: "Bottom From Here",
                era: "By Juice WRLD",
                length: "3:49",
                sourceUrl: "https://soundhelix.com",
                coverArtUrl: "https://unsplash.com"
            }
        ];

        const recentListContainer = document.getElementById('recent-list');
        const unreleasedGridContainer = document.getElementById('unreleased-grid');
        const searchBar = document.getElementById('search-bar');
        
        const audioNode = document.getElementById('global-audio-engine');
        const artNode = document.getElementById('player-art');
        const titleNode = document.getElementById('player-title');
        const eraNode = document.getElementById('player-era');

        function renderInterface(songs) {
            recentListContainer.innerHTML = '';
            unreleasedGridContainer.innerHTML = '';

            // 1. Build List Rows
            songs.forEach(song => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between p-2 hover:bg-[#282828] rounded cursor-pointer transition group";
                row.onclick = () => initPlayback(song);
                row.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <img src="${song.coverArtUrl}" class="w-10 h-10 object-cover rounded shadow">
                        <div class="truncate">
                            <div class="text-sm font-medium text-white group-hover:text-purple-400 truncate">${song.title}</div>
                            <div class="text-xs text-zinc-400 truncate">${song.era}</div>
                        </div>
                    </div>
                    <div class="text-xs text-zinc-500 pr-2">${song.length}</div>
                `;
                recentListContainer.appendChild(row);

                // 2. Build Square Cards
                const card = document.createElement('div');
                card.className = "bg-[#181818] p-4 rounded-md hover:bg-[#282828] transition cursor-pointer group shadow-lg";
                card.onclick = () => initPlayback(song);
                card.innerHTML = `
                    <div class="relative aspect-square w-full mb-4 rounded-md overflow-hidden bg-zinc-800 shadow">
                        <img src="${song.coverArtUrl}" class="w-full h-full object-cover">
                    </div>
                    <h3 class="text-sm font-bold text-white truncate group-hover:text-purple-400 mb-1">${song.title}</h3>
                    <p class="text-xs text-zinc-400 truncate">${song.era}</p>
                `;
                unreleasedGridContainer.appendChild(card);
            });
        }

        function initPlayback(song) {
            audioNode.src = song.sourceUrl;
            titleNode.textContent = song.title;
            eraNode.textContent = song.era;
            artNode.innerHTML = `<img src="${song.coverArtUrl}" class="w-full h-full object-cover">`;
            audioNode.play();
        }

        searchBar.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const matching = vaultDatabase.filter(s => s.title.toLowerCase().includes(query) || s.era.toLowerCase().includes(query));
            renderInterface(matching);
        });

        renderInterface(vaultDatabase);
    </script>
</body>
</html>
